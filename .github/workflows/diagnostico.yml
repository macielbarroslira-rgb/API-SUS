name: Diagnóstico da API oficial

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diagnostico.py
      - .github/workflows/diagnostico.yml

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diagnostico.py
      - name: Teste real de geração de planilhas
        run: |
          pip install -q -r requirements.txt
          mkdir -p saida
          python -m app.cli dados arboviroses-dengue -f "nu_ano=2024; id_municip=355030" -c dt_notific,nu_ano,id_municip,cs_sexo -n 2500 -o saida/dengue.xlsx --resumo saida/dengue.md
          python -m app.cli dados cnes-estabelecimentos -f "codigo_uf=35" -n 50 -o saida/cnes.csv --separador ";" --resumo saida/cnes.md
          python -m app.cli dados economia-da-saude-bps -f "codigoCatmat=BR0267530" -n 150 -o saida/bps.xlsx --resumo saida/bps.md || true
          cat saida/*.md >> "$GITHUB_STEP_SUMMARY"
          cat saida/*.md
          ls -la saida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico
          path: |
            swagger.json
            saida/
          if-no-files-found: ignore
