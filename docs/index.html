<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API-SUS · Consulta</title>
<style>
  :root {
    --bg: #f6f7f9; --painel: #fff; --texto: #1c2430; --suave: #5b6675; --borda: #dde2e8;
    --destaque: #0b6e4f; --destaque-texto: #fff; --erro: #b42318; --aviso: #8a5a00; --sel: #e7f4ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --painel: #1a2028; --texto: #e6e9ee; --suave: #9aa5b3; --borda: #2c3540;
      --destaque: #3fb68b; --destaque-texto: #08130e; --erro: #ff8a7a; --aviso: #f0c060; --sel: #1d3329;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--texto); }
  header { padding: 16px; border-bottom: 1px solid var(--borda); background: var(--painel); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--suave); font-size: 13px; }
  .fonte { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; font-size: 13px; }
  .fonte input[type=text] { width: min(420px, 100%); }
  details { font-size: 13px; margin-top: 6px; }
  details input { margin-top: 4px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 14px; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 16px 0 8px; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=number], select { width: 100%; padding: 7px 9px; border: 1px solid var(--borda); border-radius: 6px; background: var(--bg); }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--borda); background: var(--bg); cursor: pointer; }
  button.primario { background: var(--destaque); color: var(--destaque-texto); border-color: var(--destaque); }
  button:disabled { opacity: .5; cursor: wait; }
  .lista { list-style: none; margin: 10px 0 0; padding: 0; max-height: 70vh; overflow: auto; }
  .lista li { padding: 8px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid var(--borda); }
  .lista li:hover, .lista li.ativo { background: var(--sel); }
  .lista .grupo { font-size: 11px; text-transform: uppercase; color: var(--suave); letter-spacing: .03em; }
  .lista .cam { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  .res { font-size: 12px; color: var(--suave); }
  .campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .campos label { display: block; font-size: 13px; }
  .campos small { color: var(--suave); display: block; }
  .obrig { color: var(--erro); }
  .vars { display: flex; flex-wrap: wrap; gap: 6px 14px; max-height: 240px; overflow: auto; padding: 6px; border: 1px solid var(--borda); border-radius: 6px; }
  .vars label { font-size: 13px; white-space: nowrap; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.erro { color: var(--erro); } .msg.aviso { color: var(--aviso); }
  .url { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 6px; border: 1px solid var(--borda); }
  .tabela { overflow: auto; max-height: 60vh; margin-top: 10px; border: 1px solid var(--borda); border-radius: 6px; }
  table { border-collapse: collapse; font-size: 12px; min-width: 100%; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--borda); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--painel); }
  .vazio { color: var(--suave); }
  .dica { font-size: 12px; color: var(--suave); margin: 4px 0 0; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--borda); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--destaque); }
  [hidden] { display: none !important; }
  /* App local (modo servidor): abas, downloads e bases no computador */
  .abas { display: flex; gap: 2px; padding: 0 16px; background: var(--painel); border-bottom: 1px solid var(--borda); }
  .abas button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 12px 8px; color: var(--suave); text-align: left; }
  .abas button:hover { color: var(--texto); }
  .abas button[aria-selected=true] { color: var(--texto); border-bottom-color: var(--destaque); font-weight: 600; }
  @media (max-width: 480px) { .abas { padding: 0 8px; } .abas button { padding: 10px 8px 8px; font-size: 14px; } }
  .contador { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--destaque); color: var(--destaque-texto); font-size: 12px; font-weight: 600; text-align: center; }
  .local { display: grid; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .grade-base { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grade-base { grid-template-columns: minmax(0, 1fr); } }
  .cartoes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .cartao { border: 1px solid var(--borda); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .cartao .info { flex: 1 1 260px; min-width: 0; }
  .cartao .acoes { margin-top: 0; }
  .titulo { font-weight: 600; overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .etiqueta { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--borda); color: var(--suave); white-space: nowrap; vertical-align: 1px; }
  .etiqueta.ativo { border-color: var(--destaque); color: var(--destaque); }
  .etiqueta.concluido { background: var(--sel); border-color: var(--destaque); color: var(--destaque); }
  .etiqueta.erro { border-color: var(--erro); color: var(--erro); }
  .barra { height: 6px; border-radius: 3px; background: var(--borda); overflow: hidden; margin-top: 6px; }
  .barra span { display: block; height: 100%; width: 100%; background: var(--destaque); border-radius: 3px; }
  .barra.indeterminada span { width: 35%; animation: vaivem 1.3s ease-in-out infinite; }
  @keyframes vaivem { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .barra.indeterminada span { animation: none; width: 100%; opacity: .45; } }
  .pasta { font-size: 13px; color: var(--suave); margin: 0 0 10px; }
  .pasta code { color: var(--texto); overflow-wrap: anywhere; }
  .link { background: none; border: 0; padding: 0; color: var(--destaque); text-decoration: underline; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; max-width: 100%; border: 1px solid var(--destaque); background: var(--sel); border-radius: 999px; font-size: 13px; }
  .chip button { border: 0; background: none; border-radius: 999px; padding: 3px 2px 3px 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button.x { padding: 1px 10px 3px 6px; font-size: 17px; line-height: 1; color: var(--suave); flex: none; }
  .chip button.x:hover { color: var(--erro); }
  .painel { margin-top: 10px; border: 1px solid var(--borda); border-radius: 8px; padding: 10px; background: var(--bg); }
  .painel .acoes { margin-top: 8px; }
  .valores { max-height: 320px; overflow: auto; margin-top: 8px; border: 1px solid var(--borda); border-radius: 6px; background: var(--painel); }
  .valores label { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--borda); font-size: 13px; cursor: pointer; }
  .valores label:hover { background: var(--sel); }
  .valores .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .valores p { margin: 0; padding: 8px; }
  .n { color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 0 5px; margin-left: 4px; border-radius: 4px; background: var(--sel); color: var(--destaque); white-space: nowrap; }
  .colunas-base { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; border: 1px solid var(--borda); border-radius: 6px; }
  .colunas-base li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--borda); font-size: 13px; }
  .colunas-base .nome { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .colunas-base .n { white-space: normal; text-align: right; }
  .colunas-base button { padding: 2px 8px; font-size: 12px; flex: none; }
  .rotulo { font-size: 13px; margin-bottom: 4px; }
  .total-consulta { font-size: 15px; margin: 12px 0 0; }
  .caixa { margin-top: 16px; padding: 12px; border: 1px dashed var(--destaque); border-radius: 8px; background: var(--sel); }
  .caixa .dica { margin-top: 8px; }
  .msg.ok { color: var(--destaque); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>API-SUS: consulta à API de Dados Abertos do Ministério da Saúde</h1>
  <p id="status">Carregando catálogo...</p>
  <div class="fonte">
    <label><input type="radio" name="modo" value="direto" checked> Catálogo + planilha pelo GitHub</label>
    <label><input type="radio" name="modo" value="servidor"> Pelo servidor API-SUS:</label>
    <input type="text" id="urlServidor" placeholder="https://seu-servidor (ex.: endereço do Codespaces)">
    <button id="aplicar">Conectar</button>
  </div>
  <details>
    <summary>Avançado</summary>
    <label>URL dos dados <input type="text" id="urlBase"></label>
    <label>URLs da especificação (separadas por vírgula) <input type="text" id="urlSpecs"></label>
    <label>Paginação do offset
      <select id="modoOffset"><option value="pagina">número da página (0, 1, 2...)</option><option value="registro">índice do registro (0, 20, 40...)</option></select>
    </label>
  </details>
</header>
<nav class="abas" id="abas" role="tablist" aria-label="Telas do app" hidden>
  <button type="button" role="tab" id="abaApi" aria-selected="true" aria-controls="telaApi">Consultar API</button>
  <button type="button" role="tab" id="abaLocal" aria-selected="false" aria-controls="telaLocal">Minhas bases (no computador)<span class="contador" id="contador" hidden></span></button>
</nav>
<main id="telaApi">
  <section>
    <h2>Consultas prontas</h2>
    <select id="pronta"><option value="">Escolha uma consulta pronta...</option></select>
    <h2 style="margin-top:16px">Bases disponíveis</h2>
    <input type="text" id="busca" placeholder="Buscar (ex.: dengue, cnes, leitos)">
    <div style="margin-top:8px"><select id="grupo"><option value="">Todos os grupos</option></select></div>
    <ul class="lista" id="lista"></ul>
  </section>
  <section id="detalhe">
    <p class="vazio">Selecione uma base à esquerda.</p>
  </section>
</main>
<div id="telaLocal" class="local" role="tabpanel" aria-labelledby="abaLocal" hidden></div>
<script>
"use strict";
// =========================================================================
// Motor "direto": lê o swagger.json oficial e consulta a API pelo navegador.
// Mesma lógica de app/catalogo.py e app/consulta.py.
// =========================================================================
const BASE_PADRAO = "https://apidadosabertos.saude.gov.br";
// A API oficial não envia cabeçalhos CORS: o navegador não consegue consultá-la de outro site.
// Por isso o catálogo vem de cópias salvas neste site (atualizadas pelo GitHub Actions)
// e a planilha é gerada pelo workflow "Baixar planilha".
const specsPadrao = () => ["./swagger.json"];
const REPO = location.hostname.endsWith(".github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/").filter(Boolean)[0] || ""}`
  : "macielbarroslira-rgb/API-SUS";
const NOMES_LIMIT = ["limit", "limite"], NOMES_OFFSET = ["offset", "pagina", "page"];
const TAMANHO_PAGINA_PADRAO = 20, MAX_PAGINAS = 5000;

const normalizar = t => (t || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slug = c => normalizar(c).replace(/[{}]/g, "").replace(/[^a-z0-9_]+/g, "-").replace(/^-+|-+$/g, "") || "raiz";

function resolver(spec, obj) {
  const vistos = new Set();
  while (obj && typeof obj === "object" && obj.$ref) {
    const ref = obj.$ref;
    if (typeof ref !== "string" || !ref.startsWith("#/") || vistos.has(ref)) return {};
    vistos.add(ref);
    let alvo = spec;
    for (let p of ref.slice(2).split("/")) {
      p = p.replace(/~1/g, "/").replace(/~0/g, "~");
      if (!alvo || typeof alvo !== "object" || !(p in alvo)) return {};
      alvo = alvo[p];
    }
    obj = alvo;
  }
  return obj;
}
function mesclarAllOf(spec, s) {
  if (!s || !s.allOf) return s;
  const props = { ...(s.properties || {}) };
  for (const parte of s.allOf) Object.assign(props, mesclarAllOf(spec, resolver(spec, parte)).properties || {});
  return { ...s, type: "object", properties: props };
}
function camposDeObjeto(spec, s) {
  return Object.entries(s.properties || {}).map(([nome, prop]) => {
    prop = resolver(spec, prop) || {};
    let tipo = Array.isArray(prop.type) ? prop.type.join("/") : (prop.type || "");
    if (prop.format) tipo = tipo ? `${tipo} (${prop.format})` : prop.format;
    return { nome, tipo, descricao: prop.description || prop.title || "" };
  });
}
function extrairCampos(spec, schema) {
  schema = mesclarAllOf(spec, resolver(spec, schema));
  if (!schema || typeof schema !== "object") return [null, []];
  if (schema.type === "array" || schema.items) {
    return [null, camposDeObjeto(spec, mesclarAllOf(spec, resolver(spec, schema.items || {})) || {})];
  }
  for (const [nome, p0] of Object.entries(schema.properties || {})) {
    const p = resolver(spec, p0);
    if (p && (p.type === "array" || p.items)) {
      const item = mesclarAllOf(spec, resolver(spec, p.items || {}));
      if (item && item.properties) return [nome, camposDeObjeto(spec, item)];
    }
  }
  return [null, camposDeObjeto(spec, schema)];
}
function schemaResposta(op) {
  const r = (op.responses || {})["200"] || (op.responses || {}).default || {};
  if (r.schema) return r.schema;
  const c = r.content || {};
  for (const [mime, corpo] of Object.entries(c)) if (mime.includes("json") && corpo.schema) return corpo.schema;
  for (const corpo of Object.values(c)) if (corpo && corpo.schema) return corpo.schema;
  return null;
}
function parametro(spec, bruto) {
  const p = resolver(spec, bruto);
  if (!p || !["query", "path"].includes(p.in)) return null;
  const s = resolver(spec, p.schema || {});
  const f = s && Object.keys(s).length ? s : p;
  return {
    nome: p.name, local: p.in, obrigatorio: !!p.required || p.in === "path",
    tipo: String(f.type || p.type || "string"), formato: f.format || p.format || null,
    descricao: p.description || "", enum: f.enum || p.enum || null,
    padrao: f.default ?? p.default ?? null, minimo: f.minimum ?? p.minimum ?? null, maximo: f.maximum ?? p.maximum ?? null,
  };
}
function montarDatasets(spec) {
  if (!spec || typeof spec.paths !== "object") throw new Error("Especificação inválida (sem 'paths').");
  const ds = {};
  for (const [caminho, item0] of Object.entries(spec.paths)) {
    const item = resolver(spec, item0);
    const op = item && item.get;
    if (!op) continue;
    const params = new Map();
    for (const b of [...(item.parameters || []), ...(op.parameters || [])]) {
      const p = parametro(spec, b);
      if (p) params.set(p.local + ":" + p.nome, p);
    }
    const [chave_lista, campos] = extrairCampos(spec, schemaResposta(op));
    let id = slug(caminho);
    if (ds[id]) { let n = 2; while (ds[`${id}-${n}`]) n++; id = `${id}-${n}`; }
    const parametros = [...params.values()];
    const lim = parametros.find(p => p.local === "query" && NOMES_LIMIT.includes(p.nome.toLowerCase()));
    const off = parametros.find(p => p.local === "query" && NOMES_OFFSET.includes(p.nome.toLowerCase()));
    ds[id] = {
      id, caminho, grupo: (op.tags || [])[0] || caminho.replace(/^\/+/, "").split("/")[0] || "geral",
      resumo: (op.summary || "").trim(), descricao: (op.description || "").trim(), operation_id: op.operationId || null,
      parametros, campos, chave_lista, paginavel: !!(lim && off),
      parametro_limit: lim ? lim.nome : null, parametro_offset: off ? off.nome : null,
    };
  }
  if (!Object.keys(ds).length) throw new Error("A especificação não contém operações GET.");
  return ds;
}

function extrairRegistros(dados, chave) {
  if (Array.isArray(dados)) return dados.map(r => (r && typeof r === "object" && !Array.isArray(r)) ? r : { valor: r });
  if (dados && typeof dados === "object") {
    if (chave && Array.isArray(dados[chave])) return extrairRegistros(dados[chave]);
    const vals = Object.values(dados);
    if (vals.length === 1 && Array.isArray(vals[0])) return extrairRegistros(vals[0]);
    return [dados];
  }
  return dados == null ? [] : [{ valor: dados }];
}
function achatar(o, pre = "", s = {}) {
  for (const [k, v] of Object.entries(o || {})) {
    if (v && typeof v === "object" && !Array.isArray(v)) achatar(v, pre + k + ".", s);
    else s[pre + k] = Array.isArray(v) ? JSON.stringify(v) : v;
  }
  return s;
}
function colunasPresentes(regs) {
  const vistas = new Set();
  for (const r of regs) for (const k of Object.keys(achatar(r))) vistas.add(k);
  return [...vistas];
}

async function obterJSON(url) {
  let r;
  try { r = await fetch(url, { headers: { Accept: "application/json" } }); }
  catch (e) {
    const erro = new Error(`O navegador não conseguiu acessar ${url}. Provável bloqueio de CORS da API oficial ou falha de rede. ` +
      `Alternativa: use o modo "Pelo servidor API-SUS" (ex.: rodando no Codespaces).`);
    erro.rede = true; throw erro;
  }
  const texto = await r.text();
  if (!r.ok) { const e = new Error(`A API oficial respondeu ${r.status}: ${texto.slice(0, 300)}`); e.status = r.status; throw e; }
  try { return JSON.parse(texto); } catch { throw new Error(`Resposta não é JSON: ${texto.slice(0, 200)}`); }
}

class MotorDireto {
  constructor(base, specs, modoOffset) { this.base = base.replace(/\/+$/, ""); this.specs = specs; this.modoOffset = modoOffset; this.cache = new Map(); }
  get podeConsultar() { return !this.specs.every(u => u.startsWith("./")); }
  async variaveisSalvas() {
    if (this._vars === undefined) {
      try { this._vars = (await (await fetch("./variaveis.json")).json()).bases || {}; } catch { this._vars = {}; }
    }
    return this._vars;
  }
  async catalogo() {
    const erros = [];
    for (const url of this.specs) {
      try {
        const spec = await obterJSON(url);
        this.spec = spec; this.datasets = montarDatasets(spec); this.origem = url;
        const grupos = {};
        for (const d of Object.values(this.datasets)) grupos[d.grupo] = (grupos[d.grupo] || 0) + 1;
        return { origem: url, titulo_api_oficial: spec.info?.title, versao_api_oficial: spec.info?.version,
                 total_bases: Object.keys(this.datasets).length, grupos: Object.fromEntries(Object.entries(grupos).sort()) };
      } catch (e) { erros.push(e); }
    }
    if (erros.every(e => e.rede)) {
      throw new Error(`O navegador não conseguiu acessar ${this.base} (provável bloqueio de CORS da API oficial ou falha de rede). ` +
        `Alternativa: use o modo "Pelo servidor API-SUS" (ex.: rodando no Codespaces).`);
    }
    throw new Error("Não foi possível carregar a especificação. " + erros.map(e => e.message).join(" | "));
  }
  async listar(q, grupo) {
    let itens = Object.values(this.datasets);
    if (grupo) itens = itens.filter(d => normalizar(d.grupo) === normalizar(grupo));
    if (q) { const t = normalizar(q); itens = itens.filter(d => normalizar([d.id, d.caminho, d.grupo, d.resumo, d.descricao].join(" ")).includes(t)); }
    return itens.sort((a, b) => (a.grupo + a.caminho).localeCompare(b.grupo + b.caminho));
  }
  async detalhe(id) {
    const d = this.datasets[id]; if (!d) throw new Error(`Base '${id}' não encontrada.`);
    const v = (await this.variaveisSalvas())[id];
    if (!d.campos.length && v && v.variaveis) d.campos = v.variaveis.map(nome => ({ nome, tipo: "", descricao: "" }));
    if (v && v.paginacao) { d.paginacao = v.paginacao; d.teste_paginacao = v.teste_paginacao; }
    return d;
  }
  converter(p, v) {
    const t = String(v).trim();
    if (p.tipo === "integer") { if (!/^-?\d+$/.test(t)) throw new Error(`Filtro '${p.nome}' deve ser inteiro.`); return parseInt(t, 10); }
    if (p.tipo === "number") { const n = Number(t); if (Number.isNaN(n)) throw new Error(`Filtro '${p.nome}' deve ser numérico.`); return n; }
    return t;
  }
  url(ds, path, query) {
    let c = ds.caminho;
    for (const [k, v] of Object.entries(path)) c = c.replace(`{${k}}`, encodeURIComponent(v));
    const qs = new URLSearchParams(query).toString();
    return this.base + c + (qs ? "?" + qs : "");
  }
  async get(url) {
    if (this.cache.has(url)) return this.cache.get(url);
    const d = await obterJSON(url); this.cache.set(url, d); return d;
  }
  async dados(id, { filtros = {}, colunas = null, max_registros = 1000, paginar = true }) {
    const ds = await this.detalhe(id);
    const query = {}, path = {};
    for (const [k, v] of Object.entries(filtros)) {
      const p = ds.parametros.find(x => x.nome === k);
      if (!p || v === "" || v == null) continue;
      (p.local === "path" ? path : query)[k] = this.converter(p, v);
    }
    const controle = [ds.parametro_limit, ds.parametro_offset];
    const faltando = ds.parametros.filter(p => p.obrigatorio && !controle.includes(p.nome) && !(p.nome in query) && !(p.nome in path)).map(p => p.nome);
    if (faltando.length) throw new Error(`Preencha o(s) filtro(s) obrigatório(s): ${faltando.join(", ")}.`);
    const avisos = []; let regs = [], paginas = 0, primeiraUrl = null;
    if (!ds.paginavel || !paginar) {
      primeiraUrl = this.url(ds, path, query);
      regs = extrairRegistros(await this.get(primeiraUrl), ds.chave_lista); paginas = 1;
      if (regs.length > max_registros) { avisos.push(`Resultado truncado em ${max_registros} registros.`); regs = regs.slice(0, max_registros); }
    } else {
      const lim = ds.parametros.find(p => p.nome === ds.parametro_limit);
      const tamanho = Number(query[lim.nome] ?? lim.maximo ?? lim.padrao ?? TAMANHO_PAGINA_PADRAO);
      const inicio = Number(query[ds.parametro_offset] ?? 0); delete query[ds.parametro_offset];
      let anterior = null, interrompido = false;
      while (regs.length < max_registros && paginas < MAX_PAGINAS) {
        const desloc = inicio + (this.modoOffset === "pagina" ? paginas : paginas * tamanho);
        const u = this.url(ds, path, { ...query, [lim.nome]: tamanho, [ds.parametro_offset]: desloc });
        primeiraUrl = primeiraUrl || u;
        const pag = extrairRegistros(await this.get(u), ds.chave_lista); paginas++;
        if (!pag.length) { interrompido = true; break; }
        const dig = JSON.stringify(pag);
        if (dig === anterior) { avisos.push("A API devolveu a mesma página duas vezes; paginação interrompida. Troque o modo de offset em 'Avançado'."); interrompido = true; break; }
        anterior = dig; regs.push(...pag);
        if (pag.length < tamanho) { interrompido = true; break; }
      }
      if (!interrompido && regs.length >= max_registros) avisos.push(`Limite de ${max_registros} registros atingido; pode haver mais dados.`);
      regs = regs.slice(0, max_registros);
    }
    let cols = colunasPresentes(regs);
    if (colunas && colunas.length) {
      const ausentes = colunas.filter(c => !cols.includes(c));
      if (ausentes.length && regs.length) avisos.push(`Coluna(s) não encontrada(s): ${ausentes.join(", ")}.`);
      regs = regs.map(r => { const a = achatar(r); return Object.fromEntries(colunas.map(c => [c, a[c] ?? null])); });
      cols = [...colunas];
    }
    return { dataset: id, url_origem: primeiraUrl, filtros: { ...path, ...query }, colunas: cols,
             paginas_consultadas: paginas, total: regs.length, avisos, dados: regs };
  }
  async amostra(id, filtros) {
    if (!this.podeConsultar) {
      const v = (await this.variaveisSalvas())[id];
      if (v && v.variaveis) return v.variaveis;
      throw new Error("As variáveis desta base ainda não foram descobertas" + (v && v.erro ? ` (${v.erro})` : "") + ". Gere a planilha sem escolher colunas para ver todas.");
    }
    const ds = await this.detalhe(id);
    const f = { ...filtros };
    if (ds.parametro_limit && !(ds.parametro_limit in f)) f[ds.parametro_limit] = 5;
    if (ds.parametro_offset && !(ds.parametro_offset in f)) f[ds.parametro_offset] = ds.parametros.find(p => p.nome === ds.parametro_offset).padrao ?? 0;
    const r = await this.dados(id, { filtros: f, max_registros: 5, paginar: false });
    return r.colunas;
  }
}

// Mensagem de erro de uma resposta do servidor ({"erro"} do API-SUS ou {"detail"} do FastAPI).
function mensagemErro(corpo, r) {
  if (corpo.erro) return corpo.erro;
  const d = corpo.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(x => [(x.loc || []).slice(1).join("."), x.msg].filter(Boolean).join(": ")).join("; ");
  return d ? JSON.stringify(d) : `${r.status} ${r.statusText}`.trim();
}
const decodificar = t => { try { return decodeURIComponent(t); } catch { return t; } };
// Nome do arquivo no cabeçalho Content-Disposition (filename*=utf-8''... ou filename="...").
function nomeDoArquivo(cd) {
  if (!cd) return null;
  const estendido = /filename\*\s*=\s*[\w-]+'[^']*'([^;]+)/i.exec(cd);
  if (estendido) return decodificar(estendido[1].trim().replace(/^"|"$/g, ""));
  const simples = /filename\s*=\s*"([^"]*)"/i.exec(cd) || /filename\s*=\s*([^;]+)/i.exec(cd);
  return simples ? simples[1].trim() : null;
}

// Motor "servidor": usa os endpoints do backend API-SUS (FastAPI).
class MotorServidor {
  constructor(url) { this.url = url.replace(/\/+$/, ""); }
  get podeConsultar() { return true; }
  async req(caminho, opcoes) {
    let r;
    try { r = await fetch(this.url + caminho, opcoes); }
    catch { throw new Error(`Não foi possível acessar ${this.url}. Verifique se o servidor está no ar e se a porta está pública.`); }
    const corpo = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(mensagemErro(corpo, r));
    return corpo;
  }
  // Pedido com corpo JSON (POST, DELETE...).
  async enviar(caminho, metodo, corpo) {
    const opcoes = { method: metodo };
    if (corpo !== undefined) Object.assign(opcoes, { headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    return this.req(caminho, opcoes);
  }
  // O servidor tem as rotas do app local (baixar bases e consultá-las no computador)?
  async temAppLocal() {
    try { return (await this.req("/health")).app_local === true; } catch { return false; }
  }
  // POST que devolve um arquivo (exportação): { blob, nome, salvoEm }.
  async arquivo(caminho, corpo) {
    let r;
    try {
      r = await fetch(this.url + caminho, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    } catch { throw new Error(`Não foi possível acessar ${this.url}. Verifique se o app está aberto.`); }
    if (!r.ok) throw new Error(mensagemErro(await r.json().catch(() => ({})), r));
    const salvo = r.headers.get("X-Arquivo-Salvo");
    return { blob: await r.blob(), nome: nomeDoArquivo(r.headers.get("Content-Disposition")), salvoEm: salvo ? decodificar(salvo) : null };
  }
  async catalogo() { const c = await this.req("/api/catalogo"); return { ...c, origem: `${this.url} (${c.origem})` }; }
  async listar(q, grupo) {
    const p = new URLSearchParams(); if (q) p.set("q", q); if (grupo) p.set("grupo", grupo);
    return (await this.req("/api/datasets?" + p)).bases;
  }
  async detalhe(id) { return this.req("/api/datasets/" + encodeURIComponent(id)); }
  async dados(id, corpo) {
    return this.req(`/api/datasets/${encodeURIComponent(id)}/dados`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...corpo, formato: "json" }) });
  }
  urlArquivo(id, corpo, formato) {
    const p = new URLSearchParams(corpo.filtros);
    if (corpo.colunas) p.set("colunas", corpo.colunas.join(","));
    if (corpo.agrupar_por.length) p.set("agrupar_por", corpo.agrupar_por.join(","));
    if (corpo.somar.length) p.set("somar", corpo.somar.join(","));
    p.set("max_registros", corpo.max_registros); p.set("formato", formato); p.set("separador", ";");
    return `${this.url}/api/datasets/${encodeURIComponent(id)}/dados?${p}`;
  }
  async amostra(id, filtros) {
    const r = await this.req(`/api/datasets/${encodeURIComponent(id)}/variaveis?` + new URLSearchParams({ ...filtros, amostra: "true" }));
    if (!r.amostra) throw new Error(r.aviso || "Amostra indisponível.");
    return r.amostra.variaveis;
  }
}

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, props = {}, ...filhos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "role" || k.startsWith("aria-")) n.setAttribute(k, v); else n[k] = v;
  }
  for (const f of filhos) n.append(f instanceof Node ? f : document.createTextNode(f ?? ""));
  return n;
};
const guardar = (k, v) => { try { localStorage.setItem("apisus." + k, v); } catch {} };
const lerGuardado = k => { try { return localStorage.getItem("apisus." + k); } catch { return null; } };

async function configurarCampos() {
  const qs = new URLSearchParams(location.search);
  // Aberta pelo próprio servidor API-SUS (Codespaces, computador): usa-o diretamente.
  if (!qs.get("servidor") && location.protocol.startsWith("http") && !location.hostname.endsWith("github.io")) {
    try {
      const h = await (await fetch(new URL("health", location.href))).json();
      if ("catalogo_carregado" in h) qs.set("servidor", new URL(".", location.href).href);
    } catch {}
  }
  const modo = qs.get("servidor") ? "servidor" : (lerGuardado("modo") || "direto");

function criarMotor() {
  const modo = document.querySelector("input[name=modo]:checked").value;
  guardar("modo", modo); guardar("servidor", $("#urlServidor").value); guardar("base", $("#urlBase").value);
  guardar("specs", $("#urlSpecs").value); guardar("offset", $("#modoOffset").value);
  if (modo === "servidor") {
    if (!$("#urlServidor").value.trim()) throw new Error("Informe a URL do servidor API-SUS.");
    return new MotorServidor($("#urlServidor").value.trim());
  }
  const base = $("#urlBase").value.trim() || BASE_PADRAO;
  const specs = $("#urlSpecs").value.trim() ? $("#urlSpecs").value.split(",").map(s => s.trim()).filter(Boolean) : specsPadrao();
  return new MotorDireto(base, specs, $("#modoOffset").value);
}

  mostrarVariaveis(nomes, atual.campos);
  if (pronta) {
    for (const [caixa, nomes] of [["#agrupar", pronta.agrupar], ["#somar", pronta.somar]])
      document.querySelectorAll(`${caixa} input`).forEach(c => c.checked = nomes.includes(c.value));
  }
}

function mostrarVariaveis(nomes, campos = []) {
  const box = $("#vars"); box.replaceChildren();
  for (const id of ["#agrupar", "#somar"]) $(id).replaceChildren();
  if (!nomes.length) {
    box.append(el("span", { className: "vazio" }, "Nenhuma variável conhecida ainda. Preencha os filtros obrigatórios e clique em “Descobrir variáveis”. Sem seleção, todas as colunas são retornadas."));
    return;
  }
  const desc = Object.fromEntries(campos.map(c => [c.nome, c]));
  for (const n of nomes) box.append(el("label", { title: [desc[n]?.tipo, desc[n]?.descricao].filter(Boolean).join(" · ") }, el("input", { type: "checkbox", value: n, checked: true }), " " + n));
  const numericas = nomes.filter(n => PARECE_NUMERO.test(n)), outras = nomes.filter(n => !PARECE_NUMERO.test(n));
  for (const n of [...outras, ...numericas]) $("#agrupar").append(el("label", {}, el("input", { type: "checkbox", value: n }), " " + n));
  for (const n of [...numericas, ...outras]) $("#somar").append(el("label", {}, el("input", { type: "checkbox", value: n }), " " + n));
}
const marcar = v => document.querySelectorAll("#vars input").forEach(c => c.checked = v);
const mensagens = (lista, classe) => $("#msgs").replaceChildren(...lista.map(m => el("div", { className: "msg " + classe }, m)));

function coletar() {
  const filtros = {};
  document.querySelectorAll(".campos [name]").forEach(i => { if (i.value !== "") filtros[i.name] = i.value; });
  const todas = [...document.querySelectorAll("#vars input")];
  const marcadas = todas.filter(c => c.checked).map(c => c.value);
  const marcados = id => [...document.querySelectorAll(`${id} input`)].filter(c => c.checked).map(c => c.value);
  const max = $("#max").value.trim();
  return {
    filtros, colunas: marcadas.length && marcadas.length < todas.length ? marcadas : null,
    agrupar_por: marcados("#agrupar"), somar: marcados("#somar"),
    max_registros: max === "" ? 200 : Math.max(0, Number(max) || 0),
  };
}

async function amostrar() {

}

const fmtNum = v => typeof v === "number" ? v.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) : (v == null ? "" : String(v));

function tabelaAgregada(ag) {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, ...ag.colunas.map(c => el("th", {}, c)))));

function tabela(colunas, linhas) {

  t.append(el("thead", {}, el("tr", {}, ...colunas.map(c => el("th", {}, c)))));
  const tb = el("tbody");
  for (const l of linhas) { const a = achatar(l); tb.append(el("tr", {}, ...colunas.map(c => el("td", {}, a[c] == null ? "" : String(a[c]))))); }

  return el("div", { className: "tabela" }, t);
}

function baixar(formato) {
  if (motor.urlArquivo) { window.location.href = motor.urlArquivo(atual.id, coletar(), formato); return; }
  if (!ultimoResultado) return;
  let conteudo, tipo;
  if (formato !== "json") {  // modo de teste sem servidor: Excel vira CSV
    formato = "csv";
    const sep = $("#sep").value;
    const esc = v => { const s = v == null ? "" : String(v); return /["\n\r]/.test(s) || s.includes(sep) ? `"${s.replace(/"/g, '""')}"` : s; };
    const linhas = [ultimoResultado.colunas.map(esc).join(sep)];
    for (const r of ultimoResultado.dados) { const a = achatar(r); linhas.push(ultimoResultado.colunas.map(c => esc(a[c])).join(sep)); }
    conteudo = "﻿" + linhas.join("\n") + "\n"; tipo = "text/csv;charset=utf-8";
  } else {
    conteudo = JSON.stringify(ultimoResultado, null, 2); tipo = "application/json";
  }
  const a = el("a", { href: URL.createObjectURL(new Blob([conteudo], { type: tipo })), download: `${atual.id}.${formato}` });
  document.body.append(a); a.click(); a.remove();
}

// =========================================================================
// App local (só no modo servidor): baixar bases inteiras para o computador
// e filtrar por categorias, agrupar, somar e exportar sem depender da API.
// Rotas: /api/downloads e /api/local/bases (app/rotas_downloads.py e app/rotas_local.py).
// =========================================================================
const ATIVOS = new Set(["na_fila", "baixando", "convertendo"]);
const STATUS = { na_fila: "Na fila", baixando: "Baixando", convertendo: "Convertendo", concluido: "Concluído", erro: "Erro", cancelado: "Cancelado" };
const ROTULO_BAIXAR_BASE = "⬇️ Baixar base para o computador";
const LIMITE_PREVIA = 500, LIMITE_CATEGORIAS = 200, INTERVALO_DOWNLOADS = 2000;
const HASH_LOCAL = "minhas-bases";
const enc = encodeURIComponent;
// Estado do app local. "estados" guarda, por base, os filtros e o resumo escolhidos (enquanto a página estiver aberta).
const loc = { ativo: false, downloads: [], timer: null, estados: {}, base: null, painel: null, seq: {} };
const proximo = chave => (loc.seq[chave] = (loc.seq[chave] || 0) + 1);
const vigente = (chave, n) => loc.seq[chave] === n;

const fmtInt = n => n == null ? "?" : Number(n).toLocaleString("pt-BR");
function fmtTamanho(bytes) {
  if (bytes == null) return "";
  const unidades = ["bytes", "KB", "MB", "GB", "TB"];
  let v = Number(bytes), i = 0;
  while (v >= 1024 && i < unidades.length - 1) { v /= 1024; i++; }
  return `${v.toLocaleString("pt-BR", { maximumFractionDigits: i ? 1 : 0 })} ${unidades[i]}`;
}
function fmtData(iso) {
  const d = new Date(iso);
  return iso && !Number.isNaN(d.getTime()) ? d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : String(iso ?? "");
}
function textoFiltros(filtros, rotulo = "filtros") {
  const itens = Object.entries(filtros || {});
  if (!itens.length) return "sem filtros (base inteira)";
  return `${rotulo}: ` + itens.map(([k, v]) => `${k} = ${Array.isArray(v) ? v.join(", ") : v}`).join("; ");
}
const rotuloValor = v => v === null || v === undefined ? "(vazio)" : v === "" ? "(texto vazio)" : String(v);
const plural = (n, um, varios) => `${fmtInt(n)} ${n === 1 ? um : varios}`;
const mensagensLocal = (lista, classe) => { const box = $("#msgsLocal"); if (box) box.replaceChildren(...lista.map(m => el("div", { className: "msg " + classe }, m))); };

// ---------------------------------------------------------------- abas e rotas
function lerRota() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch {}
  if (h === HASH_LOCAL) return { tela: "local", base: null };
  if (h.startsWith(HASH_LOCAL + "/")) return { tela: "local", base: h.slice(HASH_LOCAL.length + 1) };
  return { tela: "api", base: null };
}
function irPara(hash) {
  if (decodificar(location.hash.slice(1)) === hash) aplicarRota();
  else location.hash = hash;
}
function mostrarTela(tela) {
  const local = tela === "local";
  $("#telaApi").hidden = local; $("#telaLocal").hidden = !local;
  $("#abaApi").setAttribute("aria-selected", String(!local));
  $("#abaLocal").setAttribute("aria-selected", String(local));
  document.title = local ? "API-SUS · Minhas bases" : "API-SUS · Consulta";
}
function aplicarRota() {
  if (!loc.ativo) { mostrarTela("api"); return; }
  const r = lerRota();
  mostrarTela(r.tela);
  if (r.tela !== "local") return;
  if (r.base) abrirBaseLocal(r.base); else mostrarListaLocal();
}
function ativarAppLocal() {
  loc.ativo = true;
  $("#abas").hidden = false;
  aplicarRota();
  atualizarDownloads();
}
function desativarAppLocal() {
  clearTimeout(loc.timer);
  Object.assign(loc, { ativo: false, downloads: [], timer: null, base: null, painel: null });
  proximo("downloads"); proximo("bases"); proximo("base");
  $("#abas").hidden = true;
  $("#contador").hidden = true;
  $("#telaLocal").replaceChildren();
  mostrarTela("api");
}

// ---------------------------------------------------------------- downloads
async function baixarParaComputador() {
  const { filtros } = coletar();
  if (!Object.keys(filtros).length && !confirm(
    "Nenhum filtro foi preenchido: a base INTEIRA será baixada.\n\n" +
    "Ela pode ter milhões de linhas e o download pode demorar muito (em bases grandes, horas). " +
    "Para algo mais rápido, preencha filtros como ano, UF ou município.\n\nBaixar a base inteira mesmo assim?")) return;
  const btn = $("#btnBaixarBase");
  if (btn) { btn.disabled = true; btn.textContent = "Iniciando o download..."; }
  try {
    const d = await motor.enviar("/api/downloads", "POST", { dataset: atual.id, filtros, nome: null });
    loc.downloads = [d, ...loc.downloads.filter(x => x.id !== d.id)];
    atualizarContador();
    irPara(HASH_LOCAL);
    atualizarDownloads();
  } catch (e) {
    mensagens(["Não foi possível iniciar o download: " + e.message], "erro");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = ROTULO_BAIXAR_BASE; }
  }
}

async function atualizarDownloads() {
  clearTimeout(loc.timer); loc.timer = null;
  if (!loc.ativo) return;
  const m = motor, n = proximo("downloads");
  let lista;
  try {
    lista = (await m.req("/api/downloads")).downloads;
  } catch (e) {
    if (!vigente("downloads", n) || m !== motor) return;
    const box = $("#erroDownloads");
    if (box) box.textContent = "Não foi possível atualizar os downloads: " + e.message;
    agendarDownloads();
    return;
  }
  if (!vigente("downloads", n) || m !== motor || !loc.ativo) return;
  const erro = $("#erroDownloads"); if (erro) erro.textContent = "";
  const antes = new Map(loc.downloads.map(d => [d.id, d.status]));
  loc.downloads = lista;
  // algum download terminou desde a última consulta: a lista de bases mudou
  const terminou = lista.some(d => !ATIVOS.has(d.status) && ATIVOS.has(antes.get(d.id)));
  renderDownloads();
  atualizarContador();
  if (terminou && $("#bases")) carregarBases();
  agendarDownloads();
}
function agendarDownloads() {
  clearTimeout(loc.timer);
  loc.timer = loc.ativo && loc.downloads.some(d => ATIVOS.has(d.status)) ? setTimeout(atualizarDownloads, INTERVALO_DOWNLOADS) : null;
}
function atualizarContador() {
  const n = loc.downloads.filter(d => ATIVOS.has(d.status)).length, c = $("#contador");
  c.hidden = !n; c.textContent = String(n);
  c.title = `${plural(n, "download", "downloads")} em andamento`;
}

function renderDownloads() {
  const box = $("#downloads");
  if (!box) return;
  box.closest("section").hidden = !loc.downloads.length;
  box.replaceChildren(el("ul", { className: "cartoes" }, ...loc.downloads.map(cartaoDownload)));
}
function etiqueta(status) {
  return el("span", { className: "etiqueta " + (ATIVOS.has(status) ? "ativo" : status) }, STATUS[status] || status);
}
function cartaoDownload(d) {
  const ativo = ATIVOS.has(d.status);
  const andamento = [plural(d.registros, "registro", "registros"), plural(d.paginas, "página", "páginas")];
  if (d.status === "na_fila") andamento.push("aguardando a vez (até 2 downloads ao mesmo tempo)");
  if (d.status === "convertendo") andamento.push("gravando no computador...");
  if (!ativo && d.terminado_em) andamento.push("terminado em " + fmtData(d.terminado_em));
  return el("li", { className: "cartao" },
    el("div", { className: "info" },
      el("div", {}, el("span", { className: "titulo" }, d.nome), " ", etiqueta(d.status)),
      el("div", { className: "res" }, `${d.dataset} · ${textoFiltros(d.filtros)}`),
      el("div", { className: "res" }, andamento.join(" · ")),
      ativo ? el("div", { className: "barra indeterminada", role: "progressbar", "aria-label": `Download de ${d.nome} em andamento` }, el("span"))
        : d.status === "concluido" ? el("div", { className: "barra", "aria-hidden": "true" }, el("span")) : "",
      d.erro ? el("div", { className: "msg erro" }, d.erro) : "",
      ...(d.avisos || []).map(a => el("div", { className: "msg aviso" }, a))),
    el("div", { className: "acoes" },
      ativo ? el("button", { onclick: () => cancelarDownload(d) }, "Cancelar") : "",
      d.status === "concluido" && d.registros > 0
        ? el("button", { className: "primario", onclick: () => irPara(`${HASH_LOCAL}/${d.nome}`) }, "Abrir") : ""));
}
async function cancelarDownload(d) {
  if (!confirm(`Cancelar o download de “${d.nome}”? O que já foi baixado será descartado.`)) return;
  try {
    const atualizado = await motor.enviar(`/api/downloads/${enc(d.id)}`, "DELETE");
    loc.downloads = loc.downloads.map(x => x.id === atualizado.id ? atualizado : x);
    renderDownloads(); atualizarContador();
  } catch (e) {
    const box = $("#erroDownloads"); if (box) box.textContent = "Não foi possível cancelar: " + e.message;
  }
  atualizarDownloads();
}

// ---------------------------------------------------------------- bases no computador
function mostrarListaLocal() {
  loc.base = null; loc.painel = null; proximo("base");
  $("#telaLocal").replaceChildren(
    el("section", { hidden: !loc.downloads.length },
      el("h2", {}, "Downloads"),

    el("section", {},
      el("h2", {}, "Bases no computador"),

async function carregarBases() {
  const m = motor, n = proximo("bases");

  catch (e) {
    if (vigente("bases", n) && $("#bases")) $("#bases").replaceChildren(el("p", { className: "msg erro" }, "Não foi possível listar as bases: " + e.message));

function cartaoBase(b) {
  const linha = [b.registros == null ? "registros: ?" : plural(b.registros, "registro", "registros"), fmtTamanho(b.tamanho_bytes)];
  if (b.baixado_em) linha.push("baixada em " + fmtData(b.baixado_em));

      el("div", { className: "res" }, linha.join(" · ")),
      el("div", { className: "res" }, (b.dataset ? `origem: ${b.dataset} · ` : "") + textoFiltros(b.filtros)),
      avisosRecolhidos(b.avisos)),
    el("div", { className: "acoes" },
      el("button", { className: "primario", onclick: () => irPara(`${HASH_LOCAL}/${b.nome}`) }, "Abrir"),
      el("button", { onclick: () => excluirBase(b) }, "Excluir")));

function avisosRecolhidos(avisos) {
  if (!avisos || !avisos.length) return "";
  return el("details", {}, el("summary", {}, plural(avisos.length, "aviso do download", "avisos do download")),
    ...avisos.map(a => el("div", { className: "msg aviso" }, a)));

async function excluirBase(b) {
  if (!confirm(`Excluir a base “${b.titulo || b.nome}” (${b.nome}) do computador?\n\nOs arquivos da base serão apagados. ` +
    "As planilhas já exportadas continuam na pasta exportacoes.")) return;

    await motor.enviar(`/api/local/bases/${enc(b.nome)}`, "DELETE");

// ---------------------------------------------------------------- uma base: filtros, resumo e resultado
const botaoVoltar = () => el("button", { className: "link", onclick: () => irPara(HASH_LOCAL) }, "← Minhas bases");

async function abrirBaseLocal(nome) {
  const n = proximo("base"), m = motor;
  loc.base = null; loc.painel = null;
  $("#telaLocal").replaceChildren(el("section", {}, botaoVoltar(), el("p", { className: "vazio" }, `Abrindo a base ${nome}...`)));
  let lista, info;
  try {
    [lista, info] = await Promise.all([m.req("/api/local/bases"), m.req(`/api/local/bases/${enc(nome)}/colunas`)]);
  } catch (e) {
    if (vigente("base", n)) $("#telaLocal").replaceChildren(el("section", {}, botaoVoltar(), el("p", { className: "msg erro" }, e.message)));
    return;
  }
  if (!vigente("base", n) || m !== motor) return;
  const estado = loc.estados[nome] || (loc.estados[nome] = { filtros: {}, agrupar: [], somar: [] });
  const existe = new Set(info.colunas.map(c => c.nome));  // a base pode ter sido baixada de novo
  for (const c of Object.keys(estado.filtros)) if (!existe.has(c)) delete estado.filtros[c];
  estado.agrupar = estado.agrupar.filter(c => existe.has(c));
  estado.somar = estado.somar.filter(c => existe.has(c));
  loc.base = { nome, meta: lista.bases.find(b => b.nome === nome) || { nome }, colunas: info.colunas, registros: info.registros, estado };
  renderBaseLocal();
  atualizarResultado();
}

function renderBaseLocal() {
  const b = loc.base, meta = b.meta;
  const numericas = b.colunas.filter(c => c.numerica), outras = b.colunas.filter(c => !c.numerica);
  const linha = [plural(b.registros, "registro", "registros"), plural(b.colunas.length, "coluna", "colunas")];
  if (meta.baixado_em) linha.push("baixada em " + fmtData(meta.baixado_em));
  $("#telaLocal").replaceChildren(
    el("section", {},
      botaoVoltar(),
      el("h2", { style: "margin:8px 0 4px" }, meta.titulo || b.nome),
      el("div", { className: "res" }, el("span", { className: "mono" }, b.nome), " · " + linha.join(" · ")),
      el("div", { className: "res" }, (meta.dataset ? `origem: ${meta.dataset} · ` : "") + textoFiltros(meta.filtros, "filtros do download")),
      avisosRecolhidos(meta.avisos)),
    el("div", { className: "grade-base" },
      el("section", {},
        el("h3", { style: "margin-top:0" }, "1. Filtrar por categorias"),
        el("p", { className: "dica", style: "margin:0 0 8px" }, "Escolha uma coluna, marque os valores e clique em “Aplicar filtro”. " +
          "Valores da mesma coluna valem qualquer um (OU); filtros de colunas diferentes valem juntos (E)."),
        el("div", { id: "chips", className: "chips" }),
        el("label", { style: "display:block;margin-top:10px;font-size:13px" }, "Coluna", seletorColuna()),
        el("div", { id: "painelCategorias" }),
        el("h3", {}, "2. Resumo por categorias (opcional)"),
        el("p", { className: "dica", style: "margin:0 0 8px" }, "Agrupar por: colunas de categorias (ex.: UF, sexo, procedimento). " +
          "Somar: colunas numéricas (ex.: quantidade, valor). A ordem em que você marca é a ordem das colunas; a 1ª soma ordena o resumo."),
        el("div", { className: "campos" },
          el("div", {}, el("div", { className: "rotulo" }, "Agrupar por"), caixaMarcar("agrupar", [...outras, ...numericas])),
          el("div", {}, el("div", { className: "rotulo" }, "Somar (numéricas primeiro)"), caixaMarcar("somar", [...numericas, ...outras]))),
        el("p", { id: "ordemResumo", className: "dica" }),
        el("details", { open: true, style: "margin-top:12px" },
          el("summary", {}, `Colunas da base (${b.colunas.length})`), listaColunas())),
      el("section", {},
        el("h3", { style: "margin-top:0" }, "3. Resultado"),
        el("div", { className: "acoes", style: "margin-top:0" },
          el("button", { className: "primario", id: "btnAtualizar", onclick: atualizarResultado }, "Atualizar resultado"),
          el("button", { id: "btnExpXlsx", onclick: () => exportarLocal("xlsx") }, "Exportar Excel"),
          el("button", { id: "btnExpCsv", onclick: () => exportarLocal("csv") }, "Exportar CSV")),
        el("p", { className: "dica" }, "A exportação leva TODOS os registros filtrados. Excel: abas “resumo” (se houver), “dados” e “consulta”. " +
          "CSV (separador “;”): o resumo, se houver; senão, os dados."),
        el("div", { id: "avisoResumo", className: "msg aviso" }),
        el("div", { id: "msgsLocal" }),
        el("div", { id: "resultadoLocal" }, el("p", { className: "vazio" }, "Carregando...")))));
  renderChips();
  renderOrdemResumo();
}

function seletorColuna() {
  const s = el("select", { id: "colunaFiltro" }, el("option", { value: "" }, "Escolha uma coluna para filtrar..."));
  for (const c of loc.base.colunas) s.append(el("option", { value: c.nome }, `${c.nome} (${plural(c.distintos, "valor", "valores")})`));
  s.onchange = () => s.value ? abrirCategorias(s.value) : fecharCategorias();
  return s;
}
function caixaMarcar(tipo, colunas) {
  const estado = loc.base.estado, box = el("div", { className: "vars" });
  for (const c of colunas) {
    const cb = el("input", { type: "checkbox", checked: estado[tipo].includes(c.nome) });
    cb.onchange = () => {
      estado[tipo] = estado[tipo].filter(x => x !== c.nome);
      if (cb.checked) estado[tipo].push(c.nome);
      renderOrdemResumo();
      $("#avisoResumo").textContent = "O resumo mudou: clique em “Atualizar resultado”.";
    };
    box.append(el("label", { title: c.exemplo != null ? `Exemplo: ${c.exemplo}` : "" }, cb, " " + c.nome, c.numerica ? el("span", { className: "tag" }, "numérica") : ""));
  }
  return box;
}
function renderOrdemResumo() {
  const { agrupar, somar } = loc.base.estado, box = $("#ordemResumo");
  box.textContent = agrupar.length || somar.length
    ? [agrupar.length ? "Agrupar por " + agrupar.join(" → ") : "Sem agrupar (um total geral)", somar.length ? "somar " + somar.join(", ") : "só contar registros"].join("; ") + "."
    : "Sem resumo: o resultado mostra o total de registros e a prévia dos dados.";
}
function listaColunas() {
  const ul = el("ul", { className: "colunas-base" });
  for (const c of loc.base.colunas) {
    const detalhes = [plural(c.distintos, "valor", "valores")];
    if (c.nulos) detalhes.push(plural(c.nulos, "vazio", "vazios"));
    ul.append(el("li", { title: c.exemplo != null ? `Exemplo: ${c.exemplo}` : "" },
      el("span", { className: "nome" }, c.nome, c.numerica ? el("span", { className: "tag" }, "numérica") : ""),
      el("span", { className: "n" }, detalhes.join(" · ")),
      el("button", { onclick: () => abrirCategorias(c.nome), "aria-label": `Filtrar por ${c.nome}` }, "Filtrar")));
  }
  return ul;
}

// Filtros das outras colunas (filtros em cascata: a lista de valores mostra o que ainda pode ser escolhido).
function outrosFiltros(coluna) {
  return Object.fromEntries(Object.entries(loc.base.estado.filtros).filter(([c]) => c !== coluna));
}
function abrirCategorias(coluna) {
  const b = loc.base, info = b.colunas.find(c => c.nome === coluna);
  if (!info) return;
  $("#colunaFiltro").value = coluna;
  const p = loc.painel = { coluna, selecao: new Set(b.estado.filtros[coluna] || []), busca: "" };
  const busca = el("input", { type: "text", placeholder: "Buscar valor (parte do texto, sem acento)", "aria-label": `Buscar valor de ${coluna}` });
  let espera;
  busca.oninput = () => { clearTimeout(espera); espera = setTimeout(() => { p.busca = busca.value.trim(); carregarCategorias(); }, 300); };
  const temOutros = Object.keys(outrosFiltros(coluna)).length > 0;
  const painel = el("div", { className: "painel" },
    el("div", {}, el("b", {}, coluna), el("span", { className: "res" }, ` · ${plural(info.distintos, "valor", "valores")} na base`)),
    el("p", { className: "dica", style: "margin:2px 0 8px" }, temOutros
      ? "Contagens de registros considerando os filtros das outras colunas." : "Contagem de registros de cada valor."),
    busca,
    el("div", { className: "acoes" },
      el("button", { onclick: () => marcarVisiveis(true) }, "Marcar visíveis"),
      el("button", { onclick: () => marcarVisiveis(false) }, "Desmarcar todos"),
      el("span", { id: "contSelecao", className: "res" })),
    el("div", { id: "valoresCategoria", className: "valores" }, el("p", { className: "vazio" }, "Carregando valores...")),
    el("p", { id: "notaCategorias", className: "dica" }),
    el("div", { className: "acoes" },
      el("button", { className: "primario", id: "btnAplicarFiltro", onclick: aplicarCategorias }, "Aplicar filtro"),
      el("button", { onclick: fecharCategorias }, "Fechar")));
  $("#painelCategorias").replaceChildren(painel);
  atualizarContSelecao();
  carregarCategorias();
  painel.scrollIntoView({ block: "nearest" });
}
function fecharCategorias() {
  loc.painel = null; proximo("categorias");
  $("#painelCategorias")?.replaceChildren();
  const s = $("#colunaFiltro"); if (s) s.value = "";
}
async function carregarCategorias() {
  const p = loc.painel, b = loc.base;
  if (!p || !b) return;
  const n = proximo("categorias");
  const q = new URLSearchParams({ limite: LIMITE_CATEGORIAS });
  if (p.busca) q.set("busca", p.busca);
  const outros = outrosFiltros(p.coluna);
  if (Object.keys(outros).length) q.set("filtros", JSON.stringify(outros));
  let r;
  try { r = await motor.req(`/api/local/bases/${enc(b.nome)}/categorias/${enc(p.coluna)}?${q}`); }
  catch (e) {
    if (vigente("categorias", n)) $("#valoresCategoria")?.replaceChildren(el("p", { className: "msg erro" }, e.message));
    return;
  }
  if (!vigente("categorias", n) || p !== loc.painel) return;
  p.visiveis = r.valores.map(v => v.valor);
  const box = $("#valoresCategoria");
  if (!r.valores.length) {
    box.replaceChildren(el("p", { className: "vazio" }, p.busca ? "Nenhum valor contém esse texto." : "Nenhum registro com os filtros das outras colunas."));
  } else {
    box.replaceChildren(...r.valores.map(v => {
      const cb = el("input", { type: "checkbox", checked: p.selecao.has(v.valor) });
      cb.onchange = () => { if (cb.checked) p.selecao.add(v.valor); else p.selecao.delete(v.valor); atualizarContSelecao(); };
      return el("label", {}, cb, el("span", { className: "v" + (v.valor == null || v.valor === "" ? " vazio" : "") }, rotuloValor(v.valor)),
        el("span", { className: "n" }, fmtInt(v.registros)));
    }));
  }
  $("#notaCategorias").textContent = r.truncado
    ? `Mostrando os ${fmtInt(r.valores.length)} valores mais frequentes de ${fmtInt(r.total_distintos)}. Use a busca para encontrar os demais.`
    : `${plural(r.total_distintos, "valor", "valores")}${p.busca ? " encontrado(s)" : ""}.`;
}
function marcarVisiveis(marcar) {
  const p = loc.painel; if (!p) return;
  if (marcar) (p.visiveis || []).forEach(v => p.selecao.add(v)); else p.selecao.clear();
  document.querySelectorAll("#valoresCategoria input").forEach(cb => { cb.checked = marcar; });
  atualizarContSelecao();
}
function atualizarContSelecao() {
  const p = loc.painel, box = $("#contSelecao");
  if (p && box) box.textContent = p.selecao.size ? `${plural(p.selecao.size, "valor marcado", "valores marcados")}` : "nenhum valor marcado";
}
function aplicarCategorias() {
  const p = loc.painel, filtros = loc.base.estado.filtros;
  if (!p) return;
  if (p.selecao.size) filtros[p.coluna] = [...p.selecao]; else delete filtros[p.coluna];
  fecharCategorias();
  filtrosMudaram();
}
function removerFiltro(coluna) {
  delete loc.base.estado.filtros[coluna];
  if (loc.painel && loc.painel.coluna === coluna) fecharCategorias();
  filtrosMudaram();
}
function filtrosMudaram() {
  renderChips();
  if (loc.painel) carregarCategorias();  // contagens em cascata do painel aberto
  atualizarResultado();
}
function renderChips() {
  const filtros = loc.base.estado.filtros, box = $("#chips"), itens = Object.entries(filtros);
  if (!itens.length) { box.replaceChildren(el("span", { className: "res" }, "Nenhum filtro: todos os registros da base.")); return; }
  box.replaceChildren(...itens.map(([coluna, valores]) => {
    const texto = `${coluna}: ${valores.slice(0, 3).map(rotuloValor).join(", ")}${valores.length > 3 ? ` e mais ${valores.length - 3}` : ""}`;
    return el("span", { className: "chip" },
      el("button", { title: `${coluna}: ${valores.map(rotuloValor).join(", ")} (clique para editar)`, onclick: () => abrirCategorias(coluna) }, texto),
      el("button", { className: "x", title: `Remover o filtro de ${coluna}`, "aria-label": `Remover o filtro de ${coluna}`, onclick: () => removerFiltro(coluna) }, "×"));
  }), itens.length > 1 ? el("button", { className: "link", onclick: () => { loc.base.estado.filtros = {}; fecharCategorias(); filtrosMudaram(); } }, "Limpar todos") : "");
}

function corpoLocal() {
  const { filtros, agrupar, somar } = loc.base.estado;
  return { filtros, colunas: null, agrupar_por: agrupar, somar };
}
async function atualizarResultado() {
  const b = loc.base;
  if (!b) return;
  const n = proximo("consulta"), btn = $("#btnAtualizar");
  btn.disabled = true; btn.textContent = "Atualizando...";
  mensagensLocal([], "");
  try {
    const r = await motor.enviar(`/api/local/bases/${enc(b.nome)}/consulta`, "POST", { ...corpoLocal(), limite: LIMITE_PREVIA });
    if (!vigente("consulta", n) || b !== loc.base) return;
    const filtrado = Object.keys(b.estado.filtros).length > 0;
    $("#resultadoLocal").replaceChildren(
      el("p", { className: "total-consulta" }, el("b", { id: "totalLocal" }, fmtInt(r.total)),
        ` ${r.total === 1 ? "registro" : "registros"}` + (filtrado ? ` com os filtros (de ${fmtInt(b.registros)} na base)` : " (todos os registros da base)")),
      r.agregado ? tabelaAgregada(r.agregado) : "",
      el("h3", {}, "Prévia dos dados"),
      r.linhas.length ? tabela(r.colunas, r.linhas) : el("p", { className: "vazio" }, "Nenhum registro com esses filtros."),
      r.total > r.linhas.length
        ? el("p", { className: "dica" }, `Mostrando as primeiras ${fmtInt(r.linhas.length)} linhas de ${fmtInt(r.total)}. Exporte para ter todas.`) : "");
    $("#avisoResumo").textContent = "";
  } catch (e) {
    if (vigente("consulta", n)) mensagensLocal([e.message], "erro");
  } finally {
    if (vigente("consulta", n)) { btn.disabled = false; btn.textContent = "Atualizar resultado"; }
  }
}
async function exportarLocal(formato) {
  const b = loc.base, btn = $(formato === "xlsx" ? "#btnExpXlsx" : "#btnExpCsv"), rotulo = btn.textContent;
  btn.disabled = true; btn.textContent = "Gerando...";
  mensagensLocal([], "");
  try {
    const arq = await motor.arquivo(`/api/local/bases/${enc(b.nome)}/exportar`, { ...corpoLocal(), formato });
    const nome = arq.nome || `${b.nome}.${formato}`, url = URL.createObjectURL(arq.blob);
    const a = el("a", { href: url, download: nome });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    if (b === loc.base) mensagensLocal([`Planilha “${nome}” baixada.` + (arq.salvoEm ? ` Uma cópia ficou em ${arq.salvoEm}` : "")], "ok");
  } catch (e) {
    if (b === loc.base) mensagensLocal(["Não foi possível exportar: " + e.message], "erro");
  } finally {
    btn.disabled = false; btn.textContent = rotulo;
  }
}

$("#abaApi").onclick = () => irPara("consultar");
$("#abaLocal").onclick = () => irPara(HASH_LOCAL);
window.addEventListener("hashchange", aplicarRota);

let t; $("#busca").oninput = () => { clearTimeout(t); t = setTimeout(() => motor && carregarLista(), 250); };
$("#grupo").onchange = () => motor && carregarLista();
$("#aplicar").onclick = iniciar;
document.querySelectorAll("input[name=modo]").forEach(r => r.onchange = iniciar);
for (const [i, pr] of PRONTAS.entries()) $("#pronta").append(el("option", { value: i }, pr.nome));
$("#pronta").onchange = () => {
  const pr = PRONTAS[$("#pronta").value];
  if (pr && motor) { document.querySelectorAll(".lista li").forEach(x => x.classList.remove("ativo")); abrir(pr.base, pr); }
};
configurarCampos().then(iniciar);
</script>
</body>
</html>
